// ---------- util ----------
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let lbOpen = false; const bags = {};
let ac; function beep(f, d, w = 0, type = 'sine') { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.08, ac.currentTime + w); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + w + d); o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + w); o.stop(ac.currentTime + w + d); } catch (e) { } }
let toastT; function toast(s) { const e = $('toast'); e.textContent = s; e.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = 'none', 3500); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); }
